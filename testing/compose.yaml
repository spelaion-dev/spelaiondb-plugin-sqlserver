# The server this plugin's tests run against: the same one as in SpelaionDB's repository.
#
# SQL Server 2022 (Developer edition, free for development and testing). It encrypts with a
# self-signed certificate of its own. Tests log in as `sa` and create the `spelaion` database.
# Published on 127.0.0.1:11433 (SPELAION_TEST_MSSQL=127.0.0.1:11433).
name: spelaiondb-plugin-sqlserver-test

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Spelaion-test-1
    ports:
      - "127.0.0.1:11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"select 1\" -b -o /dev/null"]
      interval: 3s
      retries: 60
      start_period: 10s
